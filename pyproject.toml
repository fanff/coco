[project]
name = "coco-walker"
version = "0.1.0"
description = "Software for Coco, a bipedal walking robot with four servos (two legs, foot and hip each)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-socketio>=5.0",
    "numpy>=1.26",
    "adafruit-circuitpython-servokit>=1.3",
    "websockets>=12.0",
    "websocket-client>=1.8",
]

[tool.uv]
package = false
